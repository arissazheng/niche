[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taste-backend"
version = "0.1.0"
description = "Taste engine, Apify sourcing and checkout API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2.6,<3", "anthropic>=2.2,<3", "python-multipart>=0.0.9", "pillow>=11"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["sourcing*", "taste*", "checkout*", "finance*"]

[tool.pytest.ini_options]
pythonpath = [".", "actors"]
